[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartmoat"
version = "3.0.0"
description = "Know your moat. Score the tasks AI can't easily take — and widen them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartmoat", "devtools"]
dependencies = []

[project.urls]
Homepage = "https://smarttasks.cloud"
Standard = "https://iaiso.org"
Repository = "https://github.com/SmartTasksOrg/sf-smartmoat"

[project.scripts]
sf-smartmoat = "sf_smartmoat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
