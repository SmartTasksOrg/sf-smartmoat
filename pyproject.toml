[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartmoat"
version = "3.0.0"
description = "Know your moat. Score the tasks AI can't easily take — and widen them."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartmoat", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartmoat"
Issues = "https://github.com/SmartTasksOrg/sf-smartmoat/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartmoat/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartmoat/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartmoat = "sf_smartmoat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
